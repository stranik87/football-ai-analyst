<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        h1{
            color:#222;
        }

        table{
            border-collapse:collapse;
            width:100%;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        th{
            background:#1f2937;
            color:white;
        }

        tr:nth-child(even){
            background:#f7f7f7;
        }
    </style>
</head>

<body>

<h1>⚽ Football AI Analyst</h1>

<h2>Последние матчи</h2>

<table>

<tr>
    <th>ID</th>
    <th>Дата</th>
    <th>Хозяева</th>
    <th>Гости</th>
    <th>Счет</th>
</tr>

{% for fixture in fixtures %}

<tr>

<td>{{ fixture.fixture_id }}</td>

<td>{{ fixture.kickoff }}</td>

<td>{{ fixture.home_team }}</td>

<td>{{ fixture.away_team }}</td>

<td>
{{ fixture.home_goals }}
:
{{ fixture.away_goals }}
</td>

</tr>

{% endfor %}

</table>

</body>
</html>
