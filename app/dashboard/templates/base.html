<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Football AI Analyst
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<header class="header">
    <h1>⚽ Football AI Analyst</h1>
</header>

<div class="wrapper">

    <aside class="sidebar">

        <a
            href="/dashboard"
            class="{% if active_page == 'dashboard' %}active{% endif %}"
        >
            📊 Dashboard
        </a>

        <a
            href="/dashboard/fixtures"
            class="{% if active_page == 'fixtures' %}active{% endif %}"
        >
            ⚽ Матчи
        </a>

        <a
            href="/dashboard/teams"
            class="{% if active_page == 'teams' %}active{% endif %}"
        >
            👥 Команды
        </a>

        <a
            href="/dashboard/leagues"
            class="{% if active_page == 'leagues' %}active{% endif %}"
        >
            🏆 Лиги
        </a>

        <a
            href="/dashboard/standings"
            class="{% if active_page == 'standings' %}active{% endif %}"
        >
            📈 Турнирная таблица
        </a>

        <a href="/docs">
            🛠 API Swagger
        </a>

    </aside>

    <main class="content">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>
</html>
